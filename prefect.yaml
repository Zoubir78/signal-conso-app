# ══════════════════════════════════════════════════════════════════════════════
# prefect.yaml — Signal Conso KPI Pipeline (SECURE VERSION)
# ══════════════════════════════════════════════════════════════════════════════

name: signal-conso

build: null
push: null

# ──────────────────────────────────────────────────────────────────────────────
# PULL STEPS
# ──────────────────────────────────────────────────────────────────────────────
pull:
  - prefect.deployments.steps.git_clone:
      id: git_clone
      repository: https://github.com/Zoubir78/signal-conso-app.git
      branch: main

  - prefect.deployments.steps.set_working_directory:
      directory: "{{ git_clone.directory }}"

  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements-flows.txt
      stream_output: true

# ──────────────────────────────────────────────────────────────────────────────
# DEPLOYMENTS
# ──────────────────────────────────────────────────────────────────────────────
deployments:

  # ─────────────────────────────
  # PIPELINE COMPLET
  # ─────────────────────────────
  - name: signal-conso-pipeline
    version: "1.0.0"

    entrypoint: src/app/flows/signal_conso_flows.py:kpi_pipeline_flow

    work_pool:
      name: signal-conso-pool
      work_queue_name: default
      job_variables:
        env:
          # ✅ NON SENSIBLE → Prefect Variables
          GCS_BUCKET_NAME: "{{ prefect.variables.gcs_bucket_name }}"
          GCS_PROCESSED_PREFIX: "{{ prefect.variables.gcs_processed_prefix }}"

    schedule:
      cron: "0 */4 * * *"
      timezone: Europe/Paris
      active: true

    parameters:
      bucket_name: "{{ prefect.variables.gcs_bucket_name }}"
      prefix: "{{ prefect.variables.gcs_processed_prefix }}"
      period: "Depuis le début du mois"
      region: null
      department_label: null

    concurrency_limit: 1


  # ─────────────────────────────
  # KPI : NOMBRE SIGNALEMENTS
  # ─────────────────────────────
  - name: kpi-nombre-signalements
    version: "1.0.0"

    entrypoint: src/app/flows/signal_conso_flows.py:flow_nombre_signalements

    work_pool:
      name: signal-conso-pool
      work_queue_name: default
      job_variables:
        env:
          GCS_BUCKET_NAME: "{{ prefect.variables.gcs_bucket_name }}"
          GCS_PROCESSED_PREFIX: "{{ prefect.variables.gcs_processed_prefix }}"

    schedule:
      cron: "0 */4 * * *"
      timezone: Europe/Paris
      active: true

    parameters: {}

    concurrency_limit: 1


  # ─────────────────────────────
  # KPI : TRANSMIS GLOBAL
  # ─────────────────────────────
  - name: kpi-transmis-global
    version: "1.0.0"

    entrypoint: src/app/flows/signal_conso_flows.py:flow_transmis_global

    work_pool:
      name: signal-conso-pool
      work_queue_name: default
      job_variables:
        env:
          GCS_BUCKET_NAME: "{{ prefect.variables.gcs_bucket_name }}"
          GCS_PROCESSED_PREFIX: "{{ prefect.variables.gcs_processed_prefix }}"

    schedule:
      cron: "0 */4 * * *"
      timezone: Europe/Paris
      active: true

    parameters:
      kpi_type: both

    concurrency_limit: 1


  # ─────────────────────────────
  # KPI : LUS AVEC RÉPONSE
  # ─────────────────────────────
  - name: kpi-signalements-lus-reponse
    version: "1.0.0"

    entrypoint: src/app/flows/signal_conso_flows.py:flow_signalements_lus_reponse

    work_pool:
      name: signal-conso-pool
      work_queue_name: default
      job_variables:
        env:
          GCS_BUCKET_NAME: "{{ prefect.variables.gcs_bucket_name }}"
          GCS_PROCESSED_PREFIX: "{{ prefect.variables.gcs_processed_prefix }}"

    schedule:
      cron: "0 */4 * * *"
      timezone: Europe/Paris
      active: true

    parameters: {}

    concurrency_limit: 1


  # ─────────────────────────────
  # DAILY REPORT
  # ─────────────────────────────
  - name: signal-conso-daily-report
    version: "1.0.0"

    entrypoint: src/app/flows/signal_conso_flows.py:kpi_pipeline_flow

    work_pool:
      name: signal-conso-pool
      work_queue_name: default
      job_variables:
        env:
          GCS_BUCKET_NAME: "{{ prefect.variables.gcs_bucket_name }}"
          GCS_PROCESSED_PREFIX: "{{ prefect.variables.gcs_processed_prefix }}"

    schedule:
      cron: "0 8 * * *"
      timezone: Europe/Paris
      active: true

    parameters:
      bucket_name: "{{ prefect.variables.gcs_bucket_name }}"
      prefix: "{{ prefect.variables.gcs_processed_prefix }}"
      period: "Depuis le début du mois"
      region: null
      department_label: null

    concurrency_limit: 1


# ──────────────────────────────────────────────────────────────────────────────
# NOTES IMPORTANTES
# ──────────────────────────────────────────────────────────────────────────────
#
# 🔐 1. VARIABLES (non sensibles)
#   prefect variable set gcs_bucket_name "clean_complaints"
#   prefect variable set gcs_processed_prefix "processed/"
#
# 🔐 2. SECRET GCP (CRITIQUE)
#   prefect block register -m prefect.blocks.system
#
#   Puis :
#   prefect block create secret signal-conso-gcp-sa-json
#   (coller le JSON du service account)
#
# ⚠️ NE JAMAIS mettre le JSON dans le YAML
#
# 🚀 3. DEPLOY
#   prefect deploy --all
#
# ⚙️ 4. WORKER
#   prefect worker start --pool signal-conso-pool
#
# ──────────────────────────────────────────────────────────────────────────────